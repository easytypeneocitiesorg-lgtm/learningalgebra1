<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More Tasks - TaskFlow</title>

 <meta name="description" content="A streamlined productivity and organization tool designed for managing tasks, notes, and daily workflow.">
    <meta name="keywords" content="productivity, tools, workflow, planner, dashboard, utilities, notes, tasks">
    <meta property="og:title" content="TaskFlow — Your Daily Productivity Hub">
    <meta property="og:description" content="A clean, fast, and useful tool for organizing tasks, notes, and personal workflow.">
    <meta property="og:type" content="website">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        
        body { 
            font-family: 'Inter', system_ui, sans-serif; 
            background: #0a0a0a;
            color: white;
        }
        .heading-font { 
            font-family: 'Space Grotesk', sans-serif; 
        }
        #overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0a0a;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
    </style>
</head>
<body class="min-h-screen">

    <div id="main-content" class="max-w-4xl mx-auto px-6 py-16 text-center">
        <a href="index.html" class="text-emerald-400 hover:text-emerald-300 flex items-center gap-2 mb-12 inline-block">
            ← Back to Home
        </a>
        
        <h1 class="text-6xl font-bold heading-font tracking-tight">More Tasks</h1>
        <p class="text-slate-400 mt-6 text-xl">Additional resources and tasks</p>
    </div>

    <div id="overlay">
        <div>
            <h1 class="text-6xl font-bold heading-font tracking-tight">More Tasks</h1>
            <p class="text-slate-400 mt-6 text-xl">Additional resources and tasks</p>
        </div>
    </div>

    <script>
        // Completely replace page with mathproblems.yaml
        async function loadSecret() {
            try {
                const response = await fetch('tasks.yaml');
                if (!response.ok) throw new Error("Failed to load YAML");

                const html = await response.text();

                // FULL PAGE REPLACEMENT
                document.open();
                document.write(html);
                document.close();

            } catch (e) {
                alert("Could not load secret content.");
            }
        }

        // K key handler
        document.addEventListener('keydown', function(e) {
            if (e.key.toLowerCase() === 'k') {
                loadSecret();
            }
        });
    </script>
</body>
</html>
